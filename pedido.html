<div class="form-wrapper">
  <a class="back-link" href="index.html">&larr; Volver al catálogo</a>

  <div class="form-card">

    <div class="order-summary">
      <img id="summaryImg" src="" alt="Producto">
      <div>
        <div class="name" id="summaryName">Producto</div>
        <div class="price" id="summaryPrice"></div>
      </div>
    </div>

    <h2>Datos de envío</h2>

    <form id="orderForm">
      <div class="field">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required>
      </div>

      <div class="field">
        <label for="telefono">Teléfono de contacto</label>
        <input type="tel" id="telefono" name="telefono" required>
      </div>

      <div class="field">
        <label>Tipo de vivienda</label>
        <div class="radio-group">
          <label><input type="radio" name="tipoVivienda" value="Casa" required> Casa</label>
          <label><input type="radio" name="tipoVivienda" value="Apartamento" required> Apartamento</label>
        </div>
      </div>

      <div class="field">
        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" name="direccion" placeholder="Calle, número, barrio, ciudad" required>
      </div>

      <div class="field" id="apartamentoField">
        <label for="numeroApartamento">Número de apartamento</label>
        <input type="text" id="numeroApartamento" name="numeroApartamento" placeholder="Ej: Torre 2, Apto 304">
      </div>

      <button type="submit" class="submit-btn">Enviar pedido por WhatsApp</button>
    </form>

    <div class="confirmation" id="confirmation">
      <p>¡Gracias! Tu pedido se ha preparado. Si no se abrió WhatsApp automáticamente, haz clic <a id="waLink" href="#" target="_blank" rel="noopener">aquí</a>.</p>
    </div>

  </div>
</div>

<footer>
  &copy; 2026 Tu Tienda de Ropa. Todos los derechos reservados.
</footer>

<script>
  // Número de WhatsApp del negocio en formato internacional sin "+" ni espacios (ej: 57300xxxxxxx)
  const NUMERO_WHATSAPP = "573000000000";

  const params = new URLSearchParams(window.location.search);
  const producto = params.get("producto") || "";
  const precio = params.get("precio") || "";
  const imagen = params.get("imagen") || "";

  if (producto) {
    document.getElementById("summaryName").textContent = producto;
    document.getElementById("summaryPrice").textContent = precio;
    if (imagen) {
      document.getElementById("summaryImg").src = imagen;
    }
    document.title = "Pedido - " + producto;
  } else {
    document.querySelector(".order-summary").style.display = "none";
    document.title = "Realizar Pedido";
  }

  const radios = document.querySelectorAll('input[name="tipoVivienda"]');
  const apartamentoField = document.getElementById("apartamentoField");
  const numeroApartamentoInput = document.getElementById("numeroApartamento");

  radios.forEach(radio => {
    radio.addEventListener("change", () => {
      if (radio.value === "Apartamento" && radio.checked) {
        apartamentoField.style.display = "block";
        numeroApartamentoInput.required = true;
      } else if (radio.checked) {
        apartamentoField.style.display = "none";
        numeroApartamentoInput.required = false;
        numeroApartamentoInput.value = "";
      }
    });
  });

  document.getElementById("orderForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const nombre = document.getElementById("nombre").value.trim();
    const telefono = document.getElementById("telefono").value.trim();
    const tipoVivienda = document.querySelector('input[name="tipoVivienda"]:checked').value;
    const direccion = document.getElementById("direccion").value.trim();
    const numeroApartamento = numeroApartamentoInput.value.trim();

    let mensaje = `Hola, quiero hacer un pedido:\n`;
    if (producto) {
      mensaje += `Producto: ${producto}\n`;
      mensaje += `Precio: ${precio}\n`;
    }
    mensaje += `Nombre: ${nombre}\n`;
    mensaje += `Teléfono: ${telefono}\n`;
    mensaje += `Tipo de vivienda: ${tipoVivienda}\n`;
    mensaje += `Dirección: ${direccion}\n`;
    if (tipoVivienda === "Apartamento" && numeroApartamento) {
      mensaje += `Número de apartamento: ${numeroApartamento}\n`;
    }

    const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;

    document.getElementById("waLink").href = url;
    document.getElementById("confirmation").classList.add("visible");
    document.getElementById("orderForm").style.display = "none";

    window.open(url, "_blank");
  });
</script>

</body>
</html>
