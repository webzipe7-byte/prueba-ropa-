<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dress Up · Realizar Pedido</title>
<meta name="description" content="Completa tus datos de envío y envía tu pedido de Dress Up por WhatsApp.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath fill=%27%23f2a679%27 d=%27M16 2l6 3.5-2.2 4.2-2.3-1.1V22H6.5V8.6L4.2 9.7 2 5.5 8 2c.6 1.7 2.1 2.8 4 2.8s3.4-1.1 4-2.8z%27/%3E%3C/svg%3E">
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand+SC&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="page-order">

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 2l6 3.5-2.2 4.2-2.3-1.1V22H6.5V8.6L4.2 9.7 2 5.5 8 2c.6 1.7 2.1 2.8 4 2.8s3.4-1.1 4-2.8z"/></svg>
      Dress Up
    </a>
    <div class="header-actions">
      <a href="index.html#carrito" aria-label="Carrito">
        <svg viewBox="0 0 24 24"><path d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM1 2h3.3l.9 2H22l-3.4 8.4c-.3.8-1.1 1.3-1.9 1.3H8.1l-.9 1.6-.1.2c0 .3.2.5.5.5H19v2H7.5A2.5 2.5 0 0 1 5.3 14.3l1.4-2.5L3 4H1V2zm5.2 4 2.4 5.7h8.1L19 6H6.2z"/></svg>
        <span class="label">Carrito</span>
        <span class="cart-count" data-count="0">0</span>
      </a>
    </div>
  </div>
</header>

<div class="form-wrapper">
  <a class="back-link" href="index.html#coleccion">&larr; Volver al catálogo</a>

  <div class="form-card">
    <h2>Datos de envío</h2>

    <div class="order-summary" id="orderSummary"></div>

    <form id="orderForm">
      <div class="field">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required>
      </div>

      <div class="field">
        <label for="telefono">Teléfono de contacto</label>
        <input type="tel" id="telefono" name="telefono" required>
      </div>

      <div class="field">
        <label for="talla">Talla</label>
        <select id="talla" name="talla" required>
          <option value="">Elige tu talla</option>
          <option>XS</option>
          <option>S</option>
          <option>M</option>
          <option>L</option>
          <option>XL</option>
        </select>
      </div>

      <div class="field">
        <label>Tipo de vivienda</label>
        <div class="radio-group">
          <label><input type="radio" name="tipoVivienda" value="Casa" required> Casa</label>
          <label><input type="radio" name="tipoVivienda" value="Apartamento" required> Apartamento</label>
        </div>
      </div>

      <div class="field">
        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" name="direccion" placeholder="Calle, número, barrio, ciudad" required>
      </div>

      <div class="field" id="apartamentoField">
        <label for="numeroApartamento">Número de apartamento</label>
        <input type="text" id="numeroApartamento" name="numeroApartamento" placeholder="Ej: Torre 2, Apto 304">
      </div>

      <button type="submit" class="submit-btn">Enviar pedido por WhatsApp</button>
    </form>

    <div class="confirmation" id="confirmation">
      <p>¡Gracias! Tu pedido se ha preparado. Si no se abrió WhatsApp automáticamente, haz clic <a id="waLink" href="#" target="_blank" rel="noopener">aquí</a>.</p>
    </div>
  </div>
</div>

<footer>
  &copy; 2026 Dress Up. Todos los derechos reservados. · <a href="contacto.html">Contacto y redes</a>
</footer>

<script src="script.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const desdeCarrito = params.get("carrito") === "1";

  // Productos del pedido: todo el carrito, o una sola prenda si vienes de "Pedir ahora"
  let productos = [];
  if (desdeCarrito) {
    productos = leerCarrito();
  } else if (params.get("producto")) {
    productos = [{
      nombre: params.get("producto"),
      precio: Number(params.get("precio")) || 0,
      imagen: params.get("imagen") || "",
      cantidad: 1
    }];
  }

  const resumen = document.getElementById("orderSummary");
  if (productos.length === 0) {
    // Sin prendas no hay pedido que enviar: invita a volver al catálogo
    resumen.innerHTML = '<p class="empty-order">Aún no has elegido ninguna prenda.</p><a class="btn-dark" href="index.html#coleccion">Ver catálogo</a>';
    resumen.classList.add("is-empty");
    document.getElementById("orderForm").style.display = "none";
  } else {
    productos.forEach((p) => {
      const fila = document.createElement("div");
      fila.className = "summary-row";
      fila.innerHTML = `<img alt=""><div><div class="name"></div><div class="price"></div></div>`;
      fila.querySelector("img").src = p.imagen;
      fila.querySelector(".name").textContent = p.nombre + (p.cantidad > 1 ? " × " + p.cantidad : "");
      fila.querySelector(".price").textContent = formatoPrecio(p.precio * p.cantidad);
      resumen.appendChild(fila);
    });
    const total = document.createElement("div");
    total.className = "summary-total";
    total.textContent = "Total: " + formatoPrecio(totalCarrito(productos));
    resumen.appendChild(total);
  }

  const radios = document.querySelectorAll('input[name="tipoVivienda"]');
  const apartamentoField = document.getElementById("apartamentoField");
  const numeroApartamentoInput = document.getElementById("numeroApartamento");

  radios.forEach((radio) => {
    radio.addEventListener("change", () => {
      const esApto = radio.value === "Apartamento" && radio.checked;
      apartamentoField.style.display = esApto ? "block" : "none";
      numeroApartamentoInput.required = esApto;
      if (!esApto) numeroApartamentoInput.value = "";
    });
  });

  document.getElementById("orderForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const nombre = document.getElementById("nombre").value.trim();
    const telefono = document.getElementById("telefono").value.trim();
    const talla = document.getElementById("talla").value;
    const tipoVivienda = document.querySelector('input[name="tipoVivienda"]:checked').value;
    const direccion = document.getElementById("direccion").value.trim();
    const numeroApartamento = numeroApartamentoInput.value.trim();

    let mensaje = "Hola Dress Up, quiero hacer un pedido:\n";
    productos.forEach((p) => {
      mensaje += `• ${p.nombre} x${p.cantidad} — ${formatoPrecio(p.precio * p.cantidad)}\n`;
    });
    if (productos.length) mensaje += `Total: ${formatoPrecio(totalCarrito(productos))}\n`;
    mensaje += `Talla: ${talla}\n`;
    mensaje += `Nombre: ${nombre}\n`;
    mensaje += `Teléfono: ${telefono}\n`;
    mensaje += `Tipo de vivienda: ${tipoVivienda}\n`;
    mensaje += `Dirección: ${direccion}\n`;
    if (tipoVivienda === "Apartamento" && numeroApartamento) {
      mensaje += `Número de apartamento: ${numeroApartamento}\n`;
    }

    const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;

    document.getElementById("waLink").href = url;
    document.getElementById("confirmation").classList.add("visible");
    document.getElementById("orderForm").style.display = "none";

    if (desdeCarrito) guardarCarrito([]);
    window.open(url, "_blank");
  });
</script>

</body>
</html>
